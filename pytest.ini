# [METABCI-PYTEST-SUITE] Pytest configuration
# Place this file in the MetaBCI project root directory

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
