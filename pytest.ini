# [METABCI-PYTEST-SUITE] Pytest configuration
# Place this file in the MetaBCI project root directory
#
# Run tests with: python -m pytest tests/ -v
# (NOT just "pytest tests/ -v" — use python -m to ensure correct path)

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
